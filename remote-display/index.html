<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Surface Player</title>
  </head>
  <body>
    <main>
      <section id="record">
        <div id="art">
          <img id="cover" alt="专辑封面" decoding="async" />
          <div id="placeholder">♫</div>
        </div>
        <h1 id="title">等待主机播放</h1>
        <div id="badges"></div>
        <p id="artist"></p>
        <p id="album"></p>
      </section>
      <section id="lyrics" aria-label="歌词">
        <div id="lyric-engine"></div>
        <div id="empty">主机开始播放后，歌词将在这里显示</div>
      </section>
    </main>
    <div id="disconnected" role="status" aria-label="主机未连接"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
