[package]
name = "audio-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8", features = ["napi9", "serde-json", "tokio_rt"] }
napi-derive = "3.5"
ffmpeg_audio = { version = "0.2.0", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"
cpal = "0.18.1"
rtrb = "0.3.4"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
url = "2"
signalsmith-stretch = "0.1.3"
lofty = "0.24"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "bmp",
  "webp",
] }
rustfft = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "local-time",
] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["macros", "formatting"] }
walkdir = "2"
tokio = { version = "1", features = ["rt"] }
tokio-util = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.1", features = ["pipewire", "realtime-dbus"] }
pipewire = { version = "0.10", features = ["v0_3_53"] }

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-audio]
version = "0.3"
features = [
  "std",
  "AudioHardware",
  "AudioHardwareDeprecated",
  "objc2",
  "objc2-foundation",
]
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell_PropertiesSystem",
]

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"

[build-dependencies]
napi-build = "2.3"

[dev-dependencies]
httpmock = "0.8.3"

[lints]
workspace = true
