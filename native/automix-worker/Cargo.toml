[package]
name = "automix-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic", "directml"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
