name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 全局最小权限，各 job 按需提升
permissions:
  contents: read

env:
  NODE_VERSION: 22.x

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60          # 防止异常构建无限挂起
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: windows-x64
            build_cmd: pnpm build:win --x64 --publish never
          - name: Windows arm64
            runner: windows-11-arm
            target: windows-arm64
            build_cmd: pnpm build:win --arm64 --publish never
          - name: macOS x64
            runner: macos-13       # ← 原生 Intel x64，非 macos-15-intel
            target: macos-x64
            build_cmd: pnpm build:mac --x64 --publish never
          - name: macOS arm64
            runner: macos-latest
            target: macos-arm64
            build_cmd: pnpm build:mac --arm64 --publish never
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
            build_cmd: pnpm build:linux --x64 --publish never
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
            build_cmd: pnpm build:linux --arm64 --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'            # ← 缓存 pnpm store，大幅提速

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/audio-engine -> target
            native/media-ctrl -> target

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev pkg-config clang \
            rpm libarchive-tools

      - name: Clean workspace
        shell: bash
        run: rm -rf dist out

      - name: Remove .npmrc
        shell: bash
        run: rm -f .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile   # ← 锁定依赖，保证可复现

      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.build_cmd }}

      - name: Rename Linux arm64 update manifest
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          if [ -f dist/latest-linux.yml ]; then
            mv dist/latest-linux.yml dist/latest-linux-arm64.yml
            echo "Renamed latest-linux.yml → latest-linux-arm64.yml"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-${{ matrix.name }}
          path: dist/*.*
          if-no-files-found: error   # ← 构建失败时立刻报错，不静默跳过

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets
          echo "Release assets:"
          ls -1 release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --draft \
            release-assets/*
