<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/icon" href="/icons/favicon.ico" />
    <link rel="preload" href="/fonts/logo.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>SPlayer Next</title>
    <style>
      @font-face {
        font-family: "logo";
        src: url("/fonts/logo.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #101014;
      }
      html.light body {
        background: #f6f6f6;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #e8e8ea;
        transition: opacity 0.3s;
      }
      html.light #app-loading {
        background: #f6f6f6;
        color: #1a1a1c;
      }
      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        filter: drop-shadow(
          0 0 20px color-mix(in srgb, var(--splash-primary, #fe7971) 45%, transparent)
        );
        animation: splash-rise 0.6s cubic-bezier(0.33, 1, 0.68, 1) 0.1s both;
      }
      .splash-name {
        font-family: "logo", sans-serif;
        font-size: 36px;
        line-height: 1;
        animation: splash-rise 0.6s cubic-bezier(0.33, 1, 0.68, 1) 0.26s both;
      }
      .splash-dots {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 65px;
        display: flex;
        justify-content: center;
        gap: 8px;
        animation: splash-rise 0.6s cubic-bezier(0.33, 1, 0.68, 1) 0.42s both;
      }
      .splash-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--splash-primary, #fe7971);
        animation: splash-dot 1.1s ease-in-out infinite;
      }
      .splash-dots i:nth-child(2) {
        animation-delay: 0.18s;
      }
      .splash-dots i:nth-child(3) {
        animation-delay: 0.36s;
      }
      .splash-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 32px;
        text-align: center;
        font-size: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        animation: splash-rise-footer 0.6s cubic-bezier(0.33, 1, 0.68, 1) 0.5s both;
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes splash-rise-footer {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.97);
        }
        to {
          opacity: 0.4;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes splash-dot {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
    </style>
    <script>
      // 确定明暗模式与主色
      (function () {
        let mode = "system";
        let primary = "#fe7971";
        try {
          const raw = localStorage.getItem("theme");
          if (raw) {
            const theme = JSON.parse(raw);
            mode = theme.mode || "system";
            if (
              theme.source === "custom" &&
              typeof theme.customColor === "string" &&
              theme.customColor.startsWith("#")
            ) {
              primary = theme.customColor;
            }
          }
        } catch (e) {}
        document.documentElement.style.setProperty("--splash-primary", primary);
        const isDark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (!isDark) document.documentElement.classList.add("light");
      })();
    </script>
  </head>

  <body>
    <div id="app-loading">
      <div class="splash">
        <img src="/icons/logo.svg" alt="SPlayer" class="splash-logo" />
        <div class="splash-name">SPlayer Next</div>
      </div>
      <div class="splash-dots">
        <i></i>
        <i></i>
        <i></i>
      </div>
      <div class="splash-footer">SPlayer Next · © 2026 imsyy</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
